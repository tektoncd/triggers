apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags-triggers
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-pipelines
data:
  # Setting this flag will determine which gated features are enabled.
  # Acceptable values are "stable" or "alpha".
  enable-api-fields: "stable"
  # Setting this field with valid regex pattern matching the pattern will exclude labels from
  # getting added to resources created by the EventListener such as the deployment
  labels-exclusion-pattern: ""
  # When "true", requests with an X-GitHub-Enterprise-Host header not in the
  # allowlist are rejected. Defaults to "false"
  # It is strongly encouraged to be set to "true" for security, and the setting will be removed
  # and always enforced in a later version
  interceptors.github.use-enterprise-host-allowlist: "false"
  # When "true", the EventListener rejects interceptor URLs that resolve to
  # loopback, link-local, private, or unspecified addresses before sending the
  # request. This guards against SSRF toward cloud metadata endpoints (for
  # example 169.254.169.254) and internal services. Defaults to "false" for
  # backwards compatibility. Hosts listed in the
  # github.enterprise-host-allowlist key of the config-triggers-core-interceptors
  # ConfigMap are exempt, so legitimate interceptor URLs on private ranges can
  # still be reached.
  interceptors.block-private-interceptor-urls: "false"

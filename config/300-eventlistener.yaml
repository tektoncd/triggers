                    If Addresses is present, Address will be ignored by clients.
                  type: object
                  properties:
                    CACerts:
                      description: |-
                        CACerts is the Certification Authority (CA) certificates in PEM format
                        according to https://www.rfc-editor.org/rfc/rfc7468.
                      type: string
                    hostname:
                      type: string
                    name:
                      description: Name is the name of the address.
                      type: string
                    url:
                      type: string
                addresses:
                  description: |-
                    Addresses is a list of addresses for different protocols (HTTP and HTTPS)
                    If Addresses is present, Address must be ignored by clients.
                  type: array
                  items:
                    description: |-
                      Addressable provides a generic mechanism for a custom resource
                      definition to indicate a destination for message delivery.

                      Addressable is the schema for the destination information. This is
                      typically stored in the object's `status`, as this information may
                      be generated by the controller.
                    type: object
                    properties:
                      CACerts:
                        description: |-
                          CACerts is the Certification Authority (CA) certificates in PEM format
                          according to https://www.rfc-editor.org/rfc/rfc7468.
                        type: string
                      hostname:
                        type: string
                      name:
                        description: Name is the name of the address.
                        type: string
                      url:
                        type: string
                annotations:
                  description: |-
                    Annotations is additional Status fields for the Resource to save some
                    additional State as well as convey more information to the user. This is
                    roughly akin to Annotations on any k8s resource, just the reconciler conveying
                    richer information outwards.
                  type: object
                  additionalProperties:
                    type: string
                conditions:
                  description: Conditions the latest available observations of a resource's current state.
                  type: array
                  items:
                    description: |-
                      Condition defines a readiness condition for a Knative resource.
                      See: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#typical-status-properties
                    type: object
                    required:
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        description: |-
                          LastTransitionTime is the last time the condition transitioned from one status to another.
                          We use VolatileTime in place of metav1.Time to exclude this from creating equality.Semantic
                          differences (all other things held constant).
                        type: string
                      message:
                        description: A human readable message indicating details about the transition.
                        type: string
                      reason:
                        description: The reason for the condition's last transition.
                        type: string
                      severity:
                        description: |-
                          Severity with which to treat failures of this type of condition.
                          When this is not specified, it defaults to Error.
                        type: string
                      status:
                        description: Status of the condition, one of True, False, Unknown.
                        type: string
                      type:
                        description: Type of condition.
                        type: string
                configuration:
                  description: Configuration stores configuration for the EventListener service
                  type: object
                  required:
                    - generatedName
                  properties:
                    generatedName:
                      description: |-
                        GeneratedResourceName is the name given to all resources reconciled by
                        the EventListener
                      type: string
                observedGeneration:
                  description: |-
                    ObservedGeneration is the 'Generation' of the Service that
                    was last processed by the controller.
                  type: integer
                  format: int64
      # Opt into the status subresource so metadata.generation
      # starts to increment
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.address.url
          name: Address
          type: string
        - jsonPath: .status.conditions[?(@.type=='Available')].status
          name: Available
          type: string
        - jsonPath: .status.conditions[?(@.type=='Available')].reason
          name: Reason
          type: string
        - jsonPath: .status.conditions[?(@.type=='Ready')].status
          name: Ready
          type: string
        - jsonPath: .status.conditions[?(@.type=='Ready')].reason
          name: Reason
          type: string

name: Go coverage

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # run at least once every 2 months to prevent the coverage artifact from expiring
  schedule:
    - cron: '14 3 3 */2 *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go-coverage:
    name: Go coverage
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write # Required by go-coverage-report to comment on PRs
      id-token: write # Required to upload coverage to Codecov via OIDC

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.workspace }}/src/github.com/tektoncd/triggers
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: "${{ github.workspace }}/src/github.com/tektoncd/triggers/go.mod"

      - name: Generate coverage
        working-directory: ${{ github.workspace }}/src/github.com/tektoncd/triggers
        run: |
          PACKAGES=$(go list ./... | grep -vE '/cmd(/|$)|/vendor(/|$)|/hack(/|$)|/test(/|$)|/fake(/|$)|/pkg/client(/|$)|/examples(/|$)|/pkg/bootstrap(/|$)')
          COVERPKG=$(echo $PACKAGES | tr ' ' ',')
          go test -coverprofile=coverage_raw.out -covermode=atomic -coverpkg="$COVERPKG" $PACKAGES || true
          grep -vE 'zz_generated\.deepcopy\.go|openapi_generated\.go|metrics/provider\.go' coverage_raw.out > coverage.out
          rm -f coverage_raw.out
          echo "Generated coverage profile"

      - name: Archive coverage results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-coverage
          path: ${{ github.workspace }}/src/github.com/tektoncd/triggers/coverage.out

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b # v1.3.1
        continue-on-error: true # This may fail if artifact on main branch does not exist (first run or expired)
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.out"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        continue-on-error: true # job still "succeeds" even if this step fails
        with:
          files: ${{ github.workspace }}/src/github.com/tektoncd/triggers/coverage.out
          flags: unit-tests
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
